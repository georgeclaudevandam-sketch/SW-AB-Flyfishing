name: Build water data from FWMIS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build_fwmis.py', '.github/workflows/build-data.yml']
  schedule:
    - cron: '0 9 1 * *'   # monthly refresh
permissions:
  contents: write
concurrency: build-data
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Download lakes, streams and species from FWMIS
        run: python3 scripts/build_fwmis.py
      - name: Size report
        run: du -sh data/water && ls data/water | wc -l
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/water
          git diff --cached --quiet && exit 0
          git commit -m "Update FWMIS water data"
          git pull --rebase
          git push
