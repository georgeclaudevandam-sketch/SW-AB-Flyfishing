name: Wall map data (roads, trails, zones)
on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-noryg2']
    paths: ['print/fetch_print_data.py', '.github/workflows/print-data.yml']
permissions:
  contents: write
concurrency:
  group: print-data-v2
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        part: ['osmx:1/3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -q shapely==2.0.6
      - run: python3 print/fetch_print_data.py '${{ matrix.part }}'
      - run: ls -la print/data
      - name: Commit this part
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add print/data
          git diff --cached --quiet && exit 0
          git commit -m "Wall map data: ${{ matrix.part }}"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 20 + 5)); done
          exit 1
